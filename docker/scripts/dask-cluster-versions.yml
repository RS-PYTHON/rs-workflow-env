# Sets of dependency versions needed by the different dpr and staging dask clusters
# NOTE: This file is also used by the rs-dpr-service ci/cd.

# The mapping between each Python/Dask combination labelled with "dpr" and the processors that use it
# is done in the values.yaml file of each "rs-dpr-service" app configured in rs-server-deployment.
# See here: https://github.com/RS-PYTHON/rs-server-deployment/tree/develop/apps
# For local mode see: https://github.com/RS-PYTHON/rs-demo/blob/develop/local-mode/nginx.conf#L103

deps:

  # CPM 2.8.1 (eopf 2.8.1 pins dask 2026.1.2 and needs python < 3.13: no rasterio 1.3.10 wheel for 3.13).
  # Used to convert the Sentinel-1 SLC SAFE products in the Zarr format read by the S1 ARD processor.
  - python_version: "3.11.18"
    dask_version: "2026.1.2"
    cpm_version: "2.8.1"
    used_by: [dpr]

  - python_version: "3.13.18"
    dask_version: "2026.7.1"
    cpm_version: "3.0.0rc4"
    used_by: [dpr, staging]
