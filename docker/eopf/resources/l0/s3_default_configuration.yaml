  # -------------------------------------------------------------
  # 7. Output Product Types
  # -------------------------------------------------------------
  # Product type identifiers for output products generated by the L0 processor.
  # These identifiers follow the Sentinel-3 product naming convention.
  # Products are organized by instrument type and processing level (CADU, intermediate, final L0).
  output_product_types:

    cadu_olci: S03OLCISP                     # CADU-level OLCI ISP product
    cadu_slstr: S03SLSISP                    # CADU-level SLSTR ISP product
    cadu_hktm: S03HKMISP                     # CADU-level HKTM ISP product
    cadu_sral: S03SRAISP                     # CADU-level SRAL ISP product
    cadu_doris: S03DORISP                    # CADU-level DORIS ISP product
    cadu_gnss: S03GNSISP                     # CADU-level GNSS ISP product
    cadu_mwr: S03MWRISP                      # CADU-level MWR ISP product
    cadu_navatt: S03NATISP                   # CADU-level NAVATT ISP product

    # Transfer Frame product
    hktm_tf: S03HKMRAW                       # HKTM Transfer Frame raw product

    # Intermediate products types
    # Intermediate products generated during processing before final Level-0 products.
    S03DORISP:                               # DORIS intermediate product types
      doris_nav: S03DONAIG                   # DORIS Navigation intermediate product
      doris_dop: S03DODOIG                   # DORIS Doppler intermediate product
    S03GNSISP:                               # GNSS intermediate product types
      gnss: S03GNS_IG                        # GNSS intermediate product
    S03MWRISP:                               # MWR intermediate product types
      mwr: S03MWR_IG                         # MWR intermediate product
    S03SRAISP:                               # SRAL intermediate product types
      sral_sra: S03ALT_IG                    # SRAL Altimeter intermediate product
      sral_cal: S03SRCRIG                    # SRAL Calibration intermediate product
    S03SLSISP:                               # SLSTR intermediate product types
      slstr: S03SLS_IG                       # SLSTR intermediate product
    S03OLCISP:                               # OLCI intermediate product types
      olci_efr: S03OLC_IG                    # OLCI Earth Frame Reference intermediate product
      olci_cal: S03OLCRIG                    # OLCI Calibration intermediate product
    S03NATISP:                               # NAVATT intermediate product types
      navatt: S03NAT_IG                      # NAVATT intermediate product
    S03HKMISP:                               # HKTM intermediate product types
      hkm_l0: S03HKM_IG                      # HKTM Level-0 intermediate product (Platform and Payload)
      hkm_l0_2: S03HKM2IG                    # HKTM Level-0 intermediate product (Platform and Payload Diagnostic)

    # OLCI Calibration product types
    S03OLCRIG:                               # OLCI Calibration intermediate product types
      - S03OLCR0G                            # OLCI Calibration product type 0
      - S03OLCR1G                            # OLCI Calibration product type 1

    # Final Level-0 products generated after all processing steps.
    S03DONAIG: S03DORNAV                     # DORIS Navigation Level-0 product
    S03DODOIG: S03DORDOP                     # DORIS Doppler Level-0 product
    S03GNS_IG: S03GNSL0_                     # GNSS Level-0 product
    S03MWR_IG: S03MWRL0_                     # MWR Level-0 product
    S03SLS_IG: S03SLSL0_                     # SLSTR Level-0 product
    S03OLC_IG: S03OLCL0_                     # OLCI Level-0 product
    S03OLCR0G: S03OLCCR0                     # OLCI Calibration Level-0 product type 0
    S03OLCR1G: S03OLCCR1                     # OLCI Calibration Level-0 product type 1
    S03NAT_IG: S03NATL0_                     # NAVATT Level-0 product
    S03ALT_IG: S03SRAL0_                     # SRAL Altimeter Level-0 product
    S03SRCRIG: S03SRAL0C                     # SRAL Calibration Level-0 product
    S03HKM_IG: S03HKML0_                     # HKTM Level-0 product (Platform and Payload)
    S03HKM2IG: S03HKM2L0                     # HKTM Level-0 product (Platform and Payload Diagnostic)

  # -------------------------------------------------------------
  # 8. Operational Mode
  # -------------------------------------------------------------
  # Strict mode configuration for enhanced validation and error handling.
  # When enabled, strict mode enforces additional validation checks and
  # may reject data that would otherwise be processed with warnings.
  strict_mode: false                          # Enable strict validation mode (processor fails if degraded packet found)

  # -------------------------------------------------------------
  # 9. Granules Generation Time
  # -------------------------------------------------------------
  # Time window (in seconds) for granule generation.
  # Granules are generated based on these time intervals for each product type.
  granules_generation_time:
    S03OLC_IG: 120                           # OLCI granule generation time window (seconds)
    S03ALT_IG: 600                           # SRAL Altimeter granule generation time window (seconds)
    S03SLS_IG: 300                           # SLSTR granule generation time window (seconds)

  # -------------------------------------------------------------
  # 10. Product-Specific Sorting
  # -------------------------------------------------------------
  # Configuration for applying instrument-specific sorting algorithms.
  # Sorting ensures proper ordering of packets within products.
  sorting:
    slstr_specific: true                     # Enable SLSTR-specific sorting
    olci_cal_specific: true                  # Enable OLCI calibration-specific sorting

  # -------------------------------------------------------------
  # 11. OLCI Calibration Configuration
  # -------------------------------------------------------------
  # OLCI (Ocean and Land Colour Instrument) spectral calibration configuration.
  # These parameters control calibration sequence processing and spectral configuration.
  spectral_configuration:
    first_sequence_code: 101                # First sequence code for OLCI calibration sequences
    spectral_sequence:                      # Spectral sequence flags (enabled/disabled for each sequence)
      - false                               # Sequence 0 (disabled)
      - true                                # Sequence 1 (enabled)
      - true                                # Sequence 2 (enabled)
      - false                               # Sequence 3 (disabled)
      - false                               # Sequence 4 (disabled)
      - false                               # Sequence 5 (disabled)
      - true                                # Sequence 6 (enabled)
      - false                               # Sequence 7 (disabled)
      - true                                # Sequence 8 (enabled)

    sequence_description:                   # OLCI calibration sequence descriptions
      S01:
        id: 101
        sequence: S01
        triggers: RAC
        description: "RADIOMETRIC CALIBRATION"
      S02:
        id: 102
        sequence: S02
        triggers: NONE
        description: "SPECTRAL CALIBRATION with DIFF1 at ORBIT N"
      S03:
        id: 103
        sequence: S03
        triggers: SPC
        description: "SPECTRAL CALIBRATION with DIFF3 at ORBIT N+1"
      S04:
        id: 104
        sequence: S04
        triggers: RAC
        description: "DIFFUSER1 AGEING at ORBIT N"
      S05:
        id: 105
        sequence: S05
        triggers: RAC
        description: "DIFFUSER1 AGEING at ORBIT N+1"
      S06:
        id: 106
        sequence: S06
        triggers: NONE
        description: "ORBITAL STABILITY"
      S07:
        id: 107
        sequence: S07
        triggers: NONE
        description: "SPECTRAL CALIBRATION using Solar Fraunhofer lines"
      S08:
        id: 108
        sequence: S08
        triggers: NONE
        description: "RADIOMETRIC CALIBRATION for observation of atmospheric absorption lines"
      S09:
        id: 109
        sequence: S09
        triggers: NONE
        description: "OBSERVATION of atmospheric absorption lines"

  # -------------------------------------------------------------
  # 12. Merge and Consolidation Parameters
  # -------------------------------------------------------------
  # Configuration for merging and consolidating granules during processing.
  # Granules within the specified merge distance are combined into larger products.
  # Minimum granule length ensures small gaps or short acquisitions are handled correctly.
  merge_and_consolidation:
    # OLCI (Ocean and Land Colour Instrument) merge and consolidation parameters
    olci:
      enabled: true                        # Enable merge and consolidation for OLCI
      min_granule_length: 16               # Minimum length of a tolerated granule in seconds
      max_merge_distance: 360              # Maximum distance between granules to be merged in seconds
      seasonnal_effect_gap: 2700           # Seasonal effect gap in seconds
    # SLSTR (Sea and Land Surface Temperature Radiometer) merge and consolidation parameters
    slstr:
      enabled: true                        # Enable merge and consolidation for SLSTR
      min_granule_length: 155              # Minimum length of a tolerated granule in seconds
      max_merge_distance: 900              # Maximum distance between granules to be merged in seconds
    # SRAL (SAR Radar Altimeter) merge and consolidation parameters
    sral:
      enabled: true                        # Enable merge and consolidation for SRAL
      min_granule_length: 16               # Minimum length of a tolerated granule in seconds
      max_merge_distance: 1200             # Maximum distance between granules to be merged in seconds

  # -------------------------------------------------------------
  # 13. Quality Checks Configuration
  # -------------------------------------------------------------
  # Configuration for quality checks and validation during processing.
  # These checks include ISP field validation, CRC checks, gap detection,
  # corrupted packet removal, and duplicate packet removal.
  quality_checks_configuration:
    # ISP Field Allowed Range
    # Allowed value ranges or fixed values for ISP header and data fields.
    # Packets with invalid field values can be discarded based on the discard_packets flag.
    # Validation types include:
    # - range: Field must be within min/max range
    isp_field_allowed_range:
      common:                               # Common ISP field validation (applied to all instruments)
        discard_packets: true               # Discard packets with invalid field values
        # Primary Header
        packet_version:                     # Packet version number validation
          type: range
          min: 0
          max: 7                            # (2^3 - 1)
        packet_type:                        # Packet type validation
          type: range
          min: 0
          max: 1                            # (2^1 - 1)
        header_flag:                        # Header flag validation
          type: range
          min: 0
          max: 1                            # (2^1 - 1)
        application_process_identifier:    # APID (Application Process Identifier) validation
          type: range
          min: 0
          max: 2047                         # (2^11 - 1)
        packet_category:                    # Packet category validation
          type: range
          min: 0
          max: 15                           # (2^4 - 1)
        sequence_flag:                      # Sequence flag validation
          type: range
          min: 0
          max: 3                            # (2^2 - 1)
        packet_sequence_count:             # Packet sequence count validation
          type: range
          min: 0
          max: 16383                        # (2^14 - 1)
        packet_data_length:                 # Packet data length validation
          type: range
          min: 14                           # Minimum: Secondary Header (12 bytes) + CRC (2 bytes)
          max: 65535                        # (2^16 - 1)
        # Secondary Header
        packet_service_type:                # Packet service type validation
          type: range
          min: 0
          max: 255                          # (2^8 - 1)
        packet_subtype:                     # Packet subtype validation
          type: range
          min: 0
          max: 255                          # (2^8 - 1)
        coarse_time:                        # Coarse time validation
          type: range
          min: 0
          max: 4294967295                   # (2^32 - 1)
        fine_time:                          # Fine time validation
          type: range
          min: 0
          max: 16777215                     # (2^24 - 1)
        time_status:                        # Time status validation
          type: range
          min: 0
          max: 255                          # (2^8 - 1)

    # Check CRC
    # Cyclic Redundancy Check (CRC) validation configuration.
    # When enabled, CRC checks verify packet integrity during processing.
    check_crc:                              # Enable CRC validation for each product type
      S03NAT_IG: true                       # Enable CRC check for NAVATT products
      S03MWR_IG: true                       # Enable CRC check for MWR products
      S03GNS_IG: true                       # Enable CRC check for GNSS products
      S03DODOIG: true                       # Enable CRC check for DORIS Doppler products
      S03DONAIG: true                       # Enable CRC check for DORIS Navigation products
      S03HKM_IG: true                       # Enable CRC check for HKTM products (Platform and Payload)
      S03HKM2IG: true                       # Enable CRC check for HKTM products (Platform and Payload Diagnostic)
      S03SLS_IG: true                       # Enable CRC check for SLSTR products
      S03OLC_IG: true                       # Enable CRC check for OLCI Observation products
      S03OLCRIG: true                       # Enable CRC check for OLCI Calibration products
      S03ALT_IG: true                       # Enable CRC check for SRAL Altimeter products
      S03SRCRIG: true                       # Enable CRC check for SRAL Calibration products

    # Check Gaps
    # Gap detection configuration for identifying missing packets in data streams.
    # When enabled, gaps between consecutive packets are detected and reported.
    check_gaps:                             # Enable gap detection for each product type
      S03NAT_IG: true                       # Enable gap check for NAVATT products
      S03MWR_IG: true                       # Enable gap check for MWR products
      S03GNS_IG: true                       # Enable gap check for GNSS products
      S03DODOIG: true                       # Enable gap check for DORIS Doppler products
      S03DONAIG: true                       # Enable gap check for DORIS Navigation products
      S03HKM_IG: true                       # Enable gap check for HKTM products (Platform and Payload)
      S03HKM2IG: true                       # Enable gap check for HKTM products (Platform and Payload Diagnostic)
      S03SLS_IG: true                       # Enable gap check for SLSTR products
      S03OLC_IG: true                       # Enable gap check for OLCI Observation products
      S03OLCRIG: true                       # Enable gap check for OLCI Calibration products
      S03ALT_IG: true                       # Enable gap check for SRAL Altimeter products
      S03SRCRIG: true                       # Enable gap check for SRAL Calibration products

    # Remove corrupted packets
    # Configuration for automatically removing corrupted packets after CRC check.
    # Corrupted packets are identified by failed CRC validation.
    remove_corrupted_packets:               # Remove corrupted packets for each product type
      S03NAT_IG: true                       # Remove corrupted NAVATT packets
      S03MWR_IG: true                       # Remove corrupted MWR packets
      S03GNS_IG: true                       # Remove corrupted GNSS packets
      S03DODOIG: true                       # Remove corrupted DORIS Doppler packets
      S03DONAIG: true                       # Remove corrupted DORIS Navigation packets
      S03HKM_IG: true                       # Remove corrupted HKTM packets (Platform and Payload)
      S03HKM2IG: true                       # Remove corrupted HKTM packets (Platform and Payload Diagnostic)
      S03SLS_IG: true                       # Remove corrupted SLSTR packets
      S03OLC_IG: true                       # Remove corrupted OLCI Observation packets
      S03OLCRIG: true                       # Remove corrupted OLCI Calibration packets
      S03ALT_IG: true                       # Remove corrupted SRAL Altimeter packets
      S03SRCRIG: true                       # Remove corrupted SRAL Calibration packets

    # Remove duplicated packets
    # Configuration for removing duplicate packets during processing.
    # Duplicate packets are identified by matching APID and sequence count.
    # Enabling this reduces data redundancy and improves processing efficiency.
    remove_duplicated_packets:              # Remove duplicate packets for each product type
      S03NAT_IG: true                       # Remove duplicate NAVATT packets
      S03MWR_IG: true                       # Remove duplicate MWR packets
      S03GNS_IG: true                       # Remove duplicate GNSS packets
