# =============================================================
# L0 Processor Configuration File for Sentinel-3
# =============================================================
# This configuration file defines all processing parameters for the
# Sentinel-3 Level-0 (L0) data processor. It includes CADU processing,
# packet routing, product types, and instrument-specific configurations
# for OLCI, SLSTR, SRAL, MWR, GNSS, DORIS, NAVATT, and HKTM instruments.

S3:
  # -------------------------------------------------------------
  # 1. Window Time Configuration
  # -------------------------------------------------------------
  # Optional time window configuration for selective processing of instrument data.
  # When enabled, only data within the specified time range will be processed.
  # This is useful for testing or reprocessing specific time segments.
  # Fine precision specifies the number of bits used for fine time encoding.
  # window_time:
  #   olci:
  #         start_slice: '2024-04-11T12:44:23.808509'
  #         stop_slice: '2024-04-11T12:46:22.041641'
  #         fine_precision: 24

  # -------------------------------------------------------------
  # 2. Reed Solomon & CADU Configuration
  # -------------------------------------------------------------
  # CADU (Channel Access Data Unit) processing configuration including
  # Reed-Solomon error correction, frame structure, and spacecraft identification.
  # These parameters define the structure of the raw telemetry data format.
  cadu_processing_configuration:
    cadu_size: 2044                       # Total CADU size in bytes
    syn_marker_size: 4                    # Synchronization marker size in bytes
    syn_marker_value: 449838109           # Fixed synchronization marker value (hex: 0x1ACFFC0D)
    annotation_size: 8                    # Annotation field size in bytes
    transfer_frame_header_size: 8         # CADU transfer frame header size in bytes
    mpdu_header_size: 2                   # MPDU (Multi-Packet Data Unit) header size in bytes
    mpdu_packet_zone_size: 1902           # MPDU packet zone data field size in bytes
    rs_check_symbols_size: 128            # Reed-Solomon error correction check symbols size in bytes
    use_dual_basis: true                  # Use dual-basis Reed-Solomon decoding
    spacecraft_id:                        # Spacecraft identifier per platform (A, B, C, D)
      a: 243                              # Sentinel-3A spacecraft ID
      b: 244                              # Sentinel-3B spacecraft ID
      c: 203                              # Sentinel-3C spacecraft ID
      d: 162                              # Sentinel-3D spacecraft ID

  # -------------------------------------------------------------
  # 3. ISP Headers Information
  # -------------------------------------------------------------
  # Instrument Source Packet (ISP) header configuration.
  # The primary header contains packet identification and timing information.
  isp_primary_header_size: 6             # ISP primary header size in bytes

  # -------------------------------------------------------------
  # 4. Packet Store Identifiers
  # -------------------------------------------------------------
  # Packet store identifiers for routing telemetry data streams.
  # Each packet store corresponds to a specific data source or instrument.
  # These values are used to filter and route packets during processing.
  packet_stores:
    navatt:                               # NAVATT (Navigation and Attitude) packet store
    - 0
    # - 4
    olci:                                 # OLCI (Ocean and Land Colour Instrument) packet store
    - 1
    slstr:                                # SLSTR (Sea and Land Surface Temperature Radiometer) packet store
    - 3
    sral:                                 # SRAL (SAR Radar Altimeter) packet store
    - 5
    mwr:                                  # MWR (Micro Wave Radiometer) packet store
    - 7
    gnss:                                 # GNSS (Global Navigation Satellite System) packet store
    - 8
    doris:                                # DORIS (Doppler Orbitography and Radiopositioning) packet store
    - 9
    hktm:                                 # HKTM (Housekeeping Telemetry) packet stores
    - 10
    - 11
    idle:                                 # Idle packet stores
    - 6
    - 13
    - 14
    - 21
    - 63

  # -------------------------------------------------------------
  # 5. Additional General Properties
  # -------------------------------------------------------------
  # STAC (SpatioTemporal Asset Catalog) metadata properties for product generation.
  # These properties define processing metadata, timeliness, platform information,
  # and provider details for each product type (OLCI, SLSTR, SRAL, MWR, GNSS, DORIS, NAVATT, HKTM).
  properties:
    mwr:
      processing:expression: systematic
      processing:facility: Copernicus S3 Core Ground Segment-DPA
      processing:version: level-0
      product:timeliness_category: NRT
      product:timeliness: PT3H
      sat:platform_international_designator: '2016-011A'
      providers:
      - name: 'SGS_'
        roles:
          - processor
      - name: 'European Space Agency'
        roles:
          - producer
