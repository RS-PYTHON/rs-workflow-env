    # Slice Configuration for Burst Processing
    # Configuration for temporal slicing of SAR products into smaller segments.
    # Slicing is useful for processing large acquisitions or creating time-bounded products.
    # For burst-based modes (IW, EW), slicing is configured by number of bursts.
    # For other modes, slicing is configured by time duration and overlap.
    slice:
      iw:
        enabled_slicing: false
        number_of_bursts: 5
        number_of_bursts_overlap: 0
      ew:
        enabled_slicing: false
        number_of_bursts: 5
        number_of_bursts_overlap: 0
      s1:
        enabled_slicing: false
        slice_length: 25000    # Slice duration in milliseconds
        slice_overlap: 7700    # Overlap duration in milliseconds
      s2:
        enabled_slicing: false
        slice_length: 25000    # Slice duration in milliseconds
        slice_overlap: 7700    # Overlap duration in milliseconds
      s3:
        enabled_slicing: false
        slice_length: 25000    # Slice duration in milliseconds
        slice_overlap: 7700    # Overlap duration in milliseconds
      s4:
