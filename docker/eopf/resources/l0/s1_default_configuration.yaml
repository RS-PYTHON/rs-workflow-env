      s4_anc: S01SS4ANC
      s5: S01SS5RAW
      s5_anc: S01SS5ANC
      s6: S01SS6RAW
      s6_anc: S01SS6ANC
      iw: S01SIWRAW
      iw_anc: S01SIWANC
      ew: S01SEWRAW
      ew_anc: S01SEWANC
      wv: S01SWVRAW
      wv_anc: S01SWVANC
      rf: S01SRFRAW
      rf_anc: S01RFCANC
      en: S01SENRAW
      en_anc: S01SENANC
      n1: S01SN1RAW
      n1_anc: S01SN1ANC
      n2: S01SN2RAW
      n2_anc: S01SN2ANC
      n3: S01SN3RAW
      n3_anc: S01SN3ANC
      n4: S01SN4RAW
      n4_anc: S01SN4ANC
      n5: S01SN5RAW
      n5_anc: S01SN5ANC
      n6: S01SN6RAW
      n6_anc: S01SN6ANC
    hktm_tf: S01HKMRAW
    gps: S01GPSRAW
