  # -------------------------------------------------------------
  # 12. ISP Field Validation Settings
  # -------------------------------------------------------------
  # ISP (Instrument Source Packet) field validation configuration.
  # These settings define allowed value ranges or fixed values for ISP header
  # and data fields. Packets with invalid field values can be discarded based
  # on the discard_packets flag. Validation types include:
  # - fixed: Field must match exact value
  # - range: Field must be within min/max range
  # - allowed: Field must be one of the specified values
  isp_field_allowed_range:
    sar:
      discard_packets: true
      synchronisation_marker:
        type: fixed
        value: 0x352EF853
      mission_datatake_id:
        type: range
        min: 1
        max: 8388607   # (2^23 - 1)
      circulation_flag:
        type: range
        min: 1
        max: 15      # (2^4 - 1)
      rfc_type:
