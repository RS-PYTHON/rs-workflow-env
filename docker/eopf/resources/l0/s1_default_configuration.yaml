  # -------------------------------------------------------------
  # 13. AIS Instrument Specific Configuration
  # -------------------------------------------------------------
  # AIS (Automatic Identification System) instrument-specific configuration.
  # These parameters control AIS data processing and time gap detection.
  ais_instrument:
    time_gap_threshold: 60000              # Time gap threshold in milliseconds

  # -------------------------------------------------------------
  # 14. SAR Instrument Specific Configuration
  # -------------------------------------------------------------
  # SAR (Synthetic Aperture Radar) instrument-specific configuration.
  # These parameters control SAR data processing, burst identification,
  # compression, signal types, noise handling, and polarization mapping.
  sar_instrument:

    # Preamble length (t_pre) and Beam cycle time (t_beam) for BURST ID computation
    # These timing parameters are used to compute burst identifiers for SAR acquisitions.
    t_pre:
      iw:                                  # IW (Interferometric Wide) preamble length in seconds
      - 2.299849
      ew:                                  # EW (Extra Wide) preamble length in seconds
      - 2.299970

    t_beam:
      iw:                                  # IW (Interferometric Wide) beam cycle time in seconds
      - 2.758273
      ew:                                  # EW (Extra Wide) beam cycle time in seconds
      - 3.038376

    # Compression Type Definitions
    # Block Adaptive Quantization (BAQ) and Flexible Dynamic Block Adaptive Quantization (FDBAQ)
    # compression mode codes for SAR data compression.
    compression_type:
      undefined_compression_type:
      - -1
      bypass:                              # Bypass compression (no compression)
      - 0
      baq_3_bit:                           # BAQ 3-bit compression
      - 3
      baq_4_bit:                           # BAQ 4-bit compression
      - 4
      baq_5_bit:                           # BAQ 5-bit compression
      - 5
      fdbaq_0:                             # FDBAQ mode 0
      - 12
      fdbaq_1:                             # FDBAQ mode 1
      - 13
      fdbaq_2:                             # FDBAQ mode 2
      - 14

    # Signal Type Definitions
    # Signal type codes for SAR data classification (noise, echo, calibration).
    signal_type:
      noise:
      - 1
      echo:
      - 0
      calibration:
      - 8
      - 9
      - 10
      - 11
      - 12
      - 15

    # Subswath ID Mapping for Echo Signal Types
    # Mapping of subswath identifiers to signal type codes for echo signal processing.
    echo_signal_type:
        s01:
        - 0
        s02:
        - 1
        s03:
        - 2
        s04:
        - 3
        s5n:
        - 4
        s5s:
        - 5
        s06:
        - 6
        iw1:
        - 10
        iw2:
        - 11
        iw3:
        - 12
        ew1:
        - 20
        ew2:
        - 21
        ew3:
        - 22
        ew4:
        - 23
        ew5:
        - 24
        wv1:
        - 30
        wv2:
        - 31

    # Noise Preamble and Postamble Lengths
    # Length (in bytes) of noise preamble and postamble data for each SAR acquisition mode.
    # These lengths are used for noise packet identification and processing.
    noise_preamble_length:
      iw:
      - 24
      ew:
      - 40
      wv:
      - 16
      # SM
      s1:
      - 8
      s2:
      - 8
      s3:
      - 8
      s4:
      - 8
      s5:
      - 8
      s6:
      - 8
      rf:
      - 8
      # AN
      n1:
      - 8
      n2:
      - 8
      n3:
      - 8
      n4:
      - 8
      n5:
      - 8
      n6:
      - 8
      en:
      - 8
    noise_postamble_length:
      iw:
      - 24
      ew:
      - 40
      wv:
