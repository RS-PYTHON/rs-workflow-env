  # -------------------------------------------------------------
  # 7. APID Mapping Configuration
  # -------------------------------------------------------------
  # Application Process Identifier (APID) mapping for data routing.
  # Each APID corresponds to a specific data stream or instrument.
  apid_mapping:
    sar:                                  # SAR (Synthetic Aperture Radar) APID
    - 1052
    gps:                                  # GPS (Global Positioning System) APIDs
    - 774
    - 779
    - 781
    - 790
    - 795
    - 797
    ais:                                  # AIS (Automatic Identification System) APID
    - 100
    idle:                                 # Idle packet APID
    - 2047
  # -------------------------------------------------------------
  # 8. Additional General Properties
  # -------------------------------------------------------------
  # STAC (SpatioTemporal Asset Catalog) metadata properties for product generation.
  # These properties define processing metadata, timeliness, platform information,
  # and provider details for each product type (SAR, HKTM, AIS, GPS).
  properties:
    sar:
      processing:expression: systematic
      processing:facility: Copernicus S1 Core Ground Segment-DPA
      processing:version: level-0
      product:timeliness_category: NRT
      product:timeliness: PT3H
      sat:platform_international_designator: '2014-016A'
      providers:
      - name: 'SGS_'
        roles:
          - processor
      - name: 'European Space Agency'
        roles:
          - producer
