  # -------------------------------------------------------------
  # 9. Remove the duplicated packets
  # -------------------------------------------------------------
  # Configuration for removing duplicate packets during processing.
  # Duplicate packets are identified by matching APID and sequence count.
  # Enabling this reduces data redundancy and improves processing efficiency.
  remove_duplicated_packets:
    sar:                                # SAR sub-mode specific duplicate removal
      s1: True                          # Remove duplicate S1 mode packets
      s2: True                          # Remove duplicate S2 mode packets
      s3: True                          # Remove duplicate S3 mode packets
      s4: True                          # Remove duplicate S4 mode packets
      s5: True                          # Remove duplicate S5 mode packets
      s6: True                          # Remove duplicate S6 mode packets
      iw: True                          # Remove duplicate IW (Interferometric Wide) mode packets
      ew: True                          # Remove duplicate EW (Extra Wide) mode packets
      wv: True                          # Remove duplicate WV (Wave) mode packets
      rf: True                          # Remove duplicate RF mode packets
      en: True                          # Remove duplicate EN mode packets
      n1: True                          # Remove duplicate N1 noise packets
      n2: True                          # Remove duplicate N2 noise packets
      n3: True                          # Remove duplicate N3 noise packets
      n4: True                          # Remove duplicate N4 noise packets
      n5: True                          # Remove duplicate N5 noise packets
      n6: True                          # Remove duplicate N6 noise packets
    gps: True                           # Remove duplicate GPS packets
    ais: True                           # Remove duplicate AIS packets

