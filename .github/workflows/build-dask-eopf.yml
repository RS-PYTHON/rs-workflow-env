# === Worklow behavior ===
#
# On automatic triggers (push or pull):
# - Check for changes in the files related to the Dask images and the base images
# - Build the base images for Dask if there are changes in the base files
# - Set environment for images build
# - Build only the Dask image linked to the detected changes, or all images if there are changes in the common files or if the base images are rebuilt
#   Each image is always built for all three target systems (cluster, local and localcluster)
# - Test rs-demo with the newly built images
#
# On manual trigger:
# - The user chooses which processor to build (l0, s1ard, s3olci, mockup or all) and for which target system (cluster, local, localcluster or all), and also to rebuild the base images or not
# - Changes are checked like in automatic mode
# - The images built are the ones for the detected changes like in automatic mode AND the ones requested by the user
# - rs-demo tests are run like in automatic mode

name: Build the Dask EOPF/DPR Docker images

# Run workflow only for ...
on:
  pull_request: # pull requests
    types: [opened, synchronize, reopened]
    paths:
      - 'docker/base/**'
      - 'docker/eopf/**'
      - 'docker/scripts/**'
      - '.github/actions/publish-docker/action.yml'
      - '.github/workflows/build-dask-eopf.yml'
  push:
    branches: [develop, main] # pushes on the 'develop' or 'main' branches
    tags: ['**'] # new git tags (including hierarchical tags like v1.0/beta)
    paths:
      - 'docker/base/**'
      - 'docker/eopf/**'
      - 'docker/scripts/**'
      - '.github/actions/publish-docker/action.yml'
      - '.github/workflows/build-dask-eopf.yml'
  workflow_dispatch: # manual trigger
    inputs:
      docker_tag:
        description: Tag the docker images as e.g. 'latest' or 'feat-rspy123'
        required: true
      processor:
        description: Which processor to build an image for
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - l0
          - s1ard
          - s3olci
          - mockup
      build_base_images:
        description: Build the base image before building the Dask images?
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      target_system:
        description: Whether to build images for cluster deployment, local deployment, LocalCluster mode or all of them
        required: false
        default: 'cluster'
        type: choice
        options:
          - all
          - cluster
          - local
          - localcluster

env:
  DOCKER_REGISTRY: ghcr.io

jobs:

  # Enable conditional execution of workflow steps and jobs, based on the files modified
  # by pull request, on a feature branch, or by the recently pushed commits.
  changes:
    runs-on: ubuntu-latest
    name: Check modified files
    permissions:
      pull-requests: read
    outputs:
      # Note: we tie "base" and "common" outputs to the manual trigger aswell, to trigger all the image builds anytime the workflow is triggered amnually.
      base: ${{ steps.filter.outputs.base }}
      common: ${{ steps.filter.outputs.common }}
      l0: ${{ steps.filter.outputs.l0 }}
      s1ard: ${{ steps.filter.outputs.s1ard }}
      s3olci: ${{ steps.filter.outputs.s3olci }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            base:
              - docker/base/build-base-images.sh
              - docker/base/Dockerfile.dask.k8s
              - docker/base/Dockerfile.dask.local
            common:
              - docker/eopf/build-dask-eopf.py
              - docker/eopf/Dockerfile.dask-eopf
              - docker/eopf/Dockerfile.dask-eopf-localcluster
              - docker/eopf/resources/layer-cleanup.sh
              - docker/eopf/resources/restore-apt.sh
            l0: ['docker/**/*dask-l0.*', 'docker/**/l0/*']
            s1ard: ['docker/**/*dask-s1ard.*']
            s3olci: ['docker/**/*dask-s3olci.*']
          list-files: 'json' # Enables listing of files matching the filter

  # Build base images for Dask only
  build-base-dask-images:
    runs-on: ubuntu-latest
    name: Build base images for Dask
    needs: [changes]
    if: ${{ (needs.changes.outputs.base == 'true') || ((github.event_name == 'workflow_dispatch') && (github.event.inputs.build_base_images == 'true')) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and push base images
        run: docker/base/build-base-images.sh -t dask --push

  # Calculate variables for this workflow
  set-env:
    runs-on: ubuntu-latest
    name: Set environment
    needs: [changes]
    outputs:
      docker_tag: ${{ steps.set-env.outputs.docker_tag }}
      branch_name: ${{ steps.set-env.outputs.branch_name }}
      common_changes: ${{ steps.set-env.outputs.common_changes }}
      any_changes: ${{ steps.set-env.outputs.any_changes }}
    steps:
      - id: set-env
        name: Set environment
        run: |
          set -x

          # Get the current branch name (or source branch for a pull request)
          if [[ ${{ github.event_name }} == pull_request ]]; then
            branch_name=${{ github.event.pull_request.head.ref }}
          else
            branch_name=${{ github.ref_name }}
          fi

          # Determine the docker tag to set to new docker images.
          # For a pull request, use the branch name
          if [[ ${{ github.event_name }} == pull_request ]]; then
            docker_tag="$branch_name"

          # For a push on develop or a tag, use the docker tag :latest
          elif [[ ${{ github.event_name }} == push ]]; then
            docker_tag=latest

          # For a manual trigger, use the user-defined tag
          elif [[ ${{ github.event_name }} == workflow_dispatch ]]; then
            docker_tag=${{ github.event.inputs.docker_tag }}

          else
            >&2 echo "Unknown trigger"
            exit 1
          fi

          # Replace special characters by -
          docker_tag=$(sed "s/[^a-zA-Z0-9]/-/g" <<< "$docker_tag")

          # We always trigger the image builds if the common files have changed
          common_changes=${{ needs.changes.outputs.common }}

          # Do we have any changes in the processor files or was the job triggered manually ?
          any_changes=false
          if [[ \
            (${common_changes} == 'true') || \
            (${{ needs.changes.outputs.base }} == 'true') || \
            (${{ needs.changes.outputs.l0 }} == 'true') || \
            (${{ needs.changes.outputs.s1ard }} == 'true') || \
            (${{ needs.changes.outputs.s3olci }} == 'true') \
          ]]; then
            any_changes=true
          fi

          # Save values
          echo "branch_name=$branch_name" >> $GITHUB_OUTPUT
          echo "docker_tag=$docker_tag" >> $GITHUB_OUTPUT
          echo "common_changes=$common_changes" >> $GITHUB_OUTPUT
          echo "any_changes=$any_changes" >> $GITHUB_OUTPUT
        shell: bash

  build-dask-eopf:
    runs-on: ubuntu-latest
    name: Build images for processor
    needs: [changes, set-env, build-base-dask-images]
    # Job run when there are changes OR a manual trigger, EVEN if any previous job is skipped
    if: ${{ always() && !failure() && !cancelled() && ((needs.set-env.outputs.any_changes == 'true') || (github.event_name == 'workflow_dispatch')) }}
    permissions: write-all

    # See: https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/run-job-variations
    strategy:
      fail-fast: false
      matrix:
        proc: [l0, s1ard, s3olci]
        target: [cluster, local, localcluster] # No option = main image for cluster deployment, "local" is for local deployment and "localcluster" is for local debugging
        include:
          - proc: l0
            proccondition: "${{ (needs.changes.outputs.l0 == 'true') || (needs.set-env.outputs.common_changes == 'true') || (needs.set-env.outputs.base == 'true') || ((github.event_name == 'workflow_dispatch') && ((github.event.inputs.processor == 'l0') || (github.event.inputs.processor == 'all'))) }}"
          - proc: s1ard
            proccondition: "${{ (needs.changes.outputs.s1ard == 'true') || (needs.set-env.outputs.common_changes == 'true') || (needs.set-env.outputs.base == 'true') || ((github.event_name == 'workflow_dispatch') && ((github.event.inputs.processor == 's1ard') || (github.event.inputs.processor == 'all'))) }}"
          - proc: s3olci
            proccondition: "${{ (needs.changes.outputs.s3olci == 'true') || (needs.set-env.outputs.common_changes == 'true') || (needs.set-env.outputs.base == 'true') || ((github.event_name == 'workflow_dispatch') && ((github.event.inputs.processor == 's3olci') || (github.event.inputs.processor == 'all'))) }}"
          - target: cluster
            targetcondition: "${{ (github.event_name != 'workflow_dispatch') || (github.event.inputs.target_system == 'cluster') || (github.event.inputs.target_system == 'all') }}"
          - target: local
            targetcondition: "${{ (github.event_name != 'workflow_dispatch') || ( github.event.inputs.target_system == 'local') || (github.event.inputs.target_system == 'all') }}"
          - target: localcluster
            targetcondition: "${{ (github.event_name != 'workflow_dispatch') || ( github.event.inputs.target_system == 'localcluster') || (github.event.inputs.target_system == 'all') }}"
    steps:

      - name: Display build info
        run: |
          echo "Building image for processor ${{ matrix.proc }} and target ${{ matrix.target }}"
          echo "Processor condition: ${{ matrix.proccondition }}"
          echo "Target condition: ${{ matrix.targetcondition }}"
        shell: bash

      - name: Checkout
        if: matrix.proccondition && matrix.targetcondition
        uses: actions/checkout@v6

      # Login to Docker Hub to increase pull quota from 100 to 200 per 6 hours
      - name: Log into Docker Hub
        if: matrix.proccondition && matrix.targetcondition
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log into GitHub Container Registry
        if: matrix.proccondition && matrix.targetcondition
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata from Git reference and GitHub events
      - name: Extract Docker metadata
        id: meta
        if: matrix.proccondition && matrix.targetcondition
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }} # ghcr.io/RS-PYTHON/rs-workflow-env

      - id: build
        name: Build the Dask images
        if: matrix.proccondition && matrix.targetcondition
        run: |
          set -x

          if [[ "${{ matrix.target }}" == "localcluster" ]]; then
            options="--local_cluster"
          fi

          if [[ "${{ matrix.target }}" == "local" ]]; then
            options="--local"
          fi

          ./docker/eopf/build-dask-eopf.py \
            --gitlab_eopf_token "${{ secrets.GITLAB_EOPF_TOKEN }}" \
            --docker_tag ${{ needs.set-env.outputs.docker_tag }} \
            --labels "${{ steps.meta.outputs.labels }}" \
            $options \
            ${{ matrix.proc }}

          # Get the docker image name and tag that was built
          last_built=$(docker images | awk 'NR==2')
          repository=$(echo "$last_built" | awk '{print $1}')
          repository_and_tag=$(echo "$last_built" | awk '{print $1 ":" $2}')

          # Save values
          echo "repository=$repository" >> $GITHUB_OUTPUT
          echo "repository_and_tag=$repository_and_tag" >> $GITHUB_OUTPUT
        shell: bash

      - name: Run Trivy vulnerability scanner
        if: matrix.proccondition && matrix.targetcondition
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1
        with:
          version: v0.69.3
          image-ref: ${{ steps.build.outputs.repository_and_tag }}
          format: sarif
          output: trivy-results-docker.sarif
          exit-code: 0
          limit-severities-for-sarif: true
          severity: HIGH,CRITICAL
          #timeout: '30m'

      - name: Upload Trivy scan results to GitHub Security tab
        if: matrix.proccondition && matrix.targetcondition
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results-docker.sarif
          category: ${{ steps.build.outputs.repository }}

      - name: Display link to Trivy results
        if: matrix.proccondition && matrix.targetcondition
        run: |

            set -x

            # If this is not a pull request, the query is "is:open+branch:branch_name"
            if [[ "${{ github.ref_name }}" != *merge* ]]; then
              query="is:open+branch:${{ github.ref_name }}"

            # Else the ref_name is e.g. '13/merge'. Change it into 'pr:13'
            else
              query=$(sed "s|\(.*\)/merge|pr:\1|g" <<< "${{ github.ref_name }}")
            fi

            echo "Trivy scan results:" \
            "https://github.com/${{ github.repository }}/security/code-scanning?query=${query}" \
            >> $GITHUB_STEP_SUMMARY
        shell: bash

      - name: Push Docker image
        if: matrix.proccondition && matrix.targetcondition
        run: docker push ${{ steps.build.outputs.repository_and_tag }}
        shell: bash

  trigger-dask-mockup-images-build:
    runs-on: ubuntu-latest
    name: Trigger rs-testmeans CI to build the Dask mockup image
    needs: [changes, set-env, build-base-dask-images]
    # Trigger CI for mockup images only if base images are changed OR if asked by manual trigger
    if: ${{ always() && !failure() && !cancelled() && ((needs.set-env.outputs.base == 'true') || ((github.event_name == 'workflow_dispatch') && ((github.event.inputs.processor == 'mockup') || (github.event.inputs.processor == 'all')))) }}
    steps:
      - env:
          TRIGGER_WORKFLOWS_TOKEN: ${{ secrets.TRIGGER_WORKFLOWS }}
        run: |
          set -x
          if [[ ${{ needs.set-env.outputs.branch_name }} == develop ]]; then
            docker_tag=latest
          else
            docker_tag=${{ needs.set-env.outputs.docker_tag }}
          fi
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TRIGGER_WORKFLOWS_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/RS-PYTHON/rs-testmeans/actions/workflows/publish-docker.yml/dispatches \
            -d '{"ref":"${{ needs.set-env.outputs.branch_name }}","inputs":{"docker_tag":"'"$docker_tag"'","build_only_mockup_images":"true"}}'
        shell: bash

  ###########
  # TESTING #
  ###########

  # Test rs-demo with the new Docker images
  test-demo:
    runs-on: ubuntu-latest
    name: Test rs-demo
    needs: [changes, set-env, build-dask-eopf]
    if: ${{ always() && !failure() && !cancelled() && ((needs.set-env.outputs.any_changes == 'true') || (github.event_name == 'workflow_dispatch')) }}
    steps:
      - name: Log into Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: test-demos
        name: Test rs-demo
        env:
          BRANCH_NAME: ${{ needs.set-env.outputs.branch_name }}
          DOCKER_TAG: ${{ needs.set-env.outputs.docker_tag }}
        run: |
          set -x

          # Clone the rs-demo repository
          git clone https://github.com/RS-PYTHON/rs-demo.git
          cd rs-demo

          # Run the rs-demo local mode using the newly created docker images
          ./test-rs-demo.sh
        shell: bash
