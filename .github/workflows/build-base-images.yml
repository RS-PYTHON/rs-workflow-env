# On automatic triggers (push or PR) that contains a change in the files listed below, this workflow builds the base images for Python and Prefect.
# On manual trigger, this workflow builds the base image(s) specified by the user.

name: Build the base Docker images

# Run workflow only for ...
on:
  pull_request: # pull requests
    types: [opened, synchronize, reopened]
    paths:
      - 'docker/base/**'
      - 'docker/scripts/**'
      - '.github/workflows/build-base-images.yml'
  push:
    branches: [develop, main] # pushes on the 'develop' or 'main' branches
    tags: ['**'] # new git tags (including hierarchical tags like v1.0/beta)
    paths:
      - 'docker/base/**'
      - 'docker/scripts/**'
      - '.github/workflows/build-base-images.yml'
  workflow_dispatch: # manual trigger
    inputs:
      target_image:
        description: Target base image to build
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - python
          - dask
          - prefect

jobs:
  build-base-python-image:
    runs-on: ubuntu-latest
    name: Build base image for Python
    if: ${{ github.event_name != 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and push base image
        run: docker/base/build-base-images.sh -t python --push

  build-base-prefect-image:
    runs-on: ubuntu-latest
    name: Build base image for Prefect
    if: ${{ github.event_name != 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and push base image
        run: docker/base/build-base-images.sh -t prefect --push

  build-requested-base-image:
    runs-on: ubuntu-latest
    name: Build requested base image
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and push base image
        run: docker/base/build-base-images.sh -t ${{ inputs.target_image }} --push
