# === Worklow behavior ===
#
# On automatic triggers (push or pull):
# - Check for changes in the files related the base images
# - Build the base images for Dask if there are changes in the base files
# - Set environment for images build
# - Build the Jupyter image
#
# On manual trigger: same workflow but the user can choose to build the base image or not.
# However, if changes are detected in the base images files, it will be built whatever the user choice

name: Build the Jupyter Docker image

# Run workflow only for ...
on:
  pull_request: # pull requests
    types: [opened, synchronize, reopened]
    paths:
      - 'docker/base/**'
      - 'docker/jupyter/**'
      - 'docker/scripts/**'
      - '.github/workflows/build-jupyter.yml'
  push:
    branches: [develop, main] # pushes on the 'develop' or 'main' branches
    tags: ['**'] # new git tags (including hierarchical tags like v1.0/beta)
    paths:
      - 'docker/base/**'
      - 'docker/jupyter/**'
      - 'docker/scripts/**'
      - '.github/workflows/build-jupyter.yml'
  workflow_dispatch: # manual trigger
    inputs:
      docker_tag:
        description: Tag the docker images as e.g. 'latest'
        required: false
      build_base_image:
        description: Build the base image before building the Jupyter image?
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  DOCKER_REGISTRY: ghcr.io
  TRIVY_SKIP_DIRS: /opt/conda/pkgs/cache
  TRIVY_SKIP_FILES: /opt/conda/lib/python3.*/site-packages/bokeh/server/static/js/compiler.js,/opt/conda/lib/python3.*/site-packages/prefect/server/ui/assets/index-CCNfsmcm.js.map

jobs:

  set-binary-env:
    name: Set environment for publishing Docker images
    if: github.actor != 'dependabot[bot]' # ignore pull requests by github bot
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.set-binary-env.outputs.branch_name }}
      docker_tags: ${{ case(
        steps.set-binary-env.outputs.docker_final_tags != '',
        steps.set-binary-env.outputs.docker_final_tags,
        steps.set-binary-env.outputs.docker_tags) }} # don't use temp tags, take directly the final tags
    steps:
      - id: set-binary-env
        name: Call action 'set-binary-env'
        uses: RS-PYTHON/actions/.github/actions/set-binary-env@develop
        with:
          manual_tag: ${{ github.event.inputs.docker_tag }}

  # Enable conditional execution of workflow steps and jobs, based on the files modified
  # by pull request, on a feature branch, or by the recently pushed commits.
  changes:
    runs-on: ubuntu-latest
    name: Check modified files for base images
    permissions:
      pull-requests: read
    outputs:
      base: ${{ steps.filter.outputs.base }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            base:
              - docker/base/Dockerfile.jupyter
              - docker/scripts/create-jupyter-kernels.sh
              - docker/scripts/dask-cluster-versions.yml
          list-files: 'json' # Enables listing of files matching the filter

  # Build base Jupyter image
  build-base-jupyter-image:
    runs-on: ubuntu-latest
    name: Build base image for Jupyter
    needs: [set-binary-env, changes]
    if: ${{
      (needs.changes.outputs.base == 'true') ||
      ((github.event_name == 'workflow_dispatch') && (github.event.inputs.build_base_image == 'true'))
      }}
    permissions:
      contents: read
      packages: write
    outputs:
      base-tag: ${{ steps.base-tag.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Aggressive cleanup
        run: |
          # Cleanup disk space (level between 0 and 15, more cleaning takes more time)
          wget --max-redirect=0 \
            https://raw.githubusercontent.com/RS-PYTHON/rs-infra-core/refs/heads/develop/.github/common/resources/aggressive-cleanup.sh
          ./aggressive-cleanup.sh 7
        shell: bash

      - id: publish-docker
        uses: RS-PYTHON/actions/.github/actions/publish-docker@develop
        with:
          dockerfile: ./docker/base/Dockerfile.jupyter
          build_context_path: ./docker/scripts
          image_basename: ${{ github.repository_owner }}/
          image_suffix: quay.io/jupyter/base-notebook
          image_tags: ${{ needs.set-binary-env.outputs.docker_tags }}
          dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trivy_skip_dirs: ${{ env.TRIVY_SKIP_DIRS }}
          trivy_skip_files: ${{ env.TRIVY_SKIP_FILES }}

      - name: Base image tag
        id: base-tag
        run: |
          # Keep the first image tag from a list as tag1,tag2,tag3
          value=$(echo ${{ needs.set-binary-env.outputs.docker_tags }} | cut -d , -f1)
          echo "value=$value" >> $GITHUB_OUTPUT

  publish-docker:
    if: ${{ always() && !failure() && !cancelled() && (github.actor != 'dependabot[bot]') }} # Run the job even if previous job was skipped
    runs-on: ubuntu-latest
    name: Build image for Jupyter
    needs: [set-binary-env, build-base-jupyter-image]
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v6

        # clone rs-infra-core to use the GH runner cleanup script
      - name: Checkout infra-core repository
        uses: actions/checkout@v6
        with:
          repository: RS-PYTHON/rs-infra-core
          path: rs-infra-core
      - name: Aggressive cleanup
        run: |
          # Cleanup disk space (level between 0 and 15, more cleaning takes more time)
          ./rs-infra-core/.github/common/resources/aggressive-cleanup.sh 7
        shell: bash

      - name: Copy common requirements
        id: copy_common_req
        shell: bash
        run: |
          mkdir -p ./docker/jupyter/resources/
          cp ./docker/scripts/*.* ./docker/jupyter/resources/

      - id: rs-client-run-id
        name: Get latest run ID from rs-client-libraries
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: rs-client-libraries
          RS_SERVER_PAT: ${{ secrets.RS_SERVER_PAT }}
          WORKFLOW_FILE: "publish-binaries.yml"
          CURRENT_BRANCH: ${{ needs.set-binary-env.outputs.branch_name }}
        run: |
          set -x

          # Test to download from the current branch name, or develop
          if [[ $CURRENT_BRANCH == develop ]]; then
              BRANCHES="develop"
          else
              BRANCHES="$CURRENT_BRANCH develop"
          fi
          for BRANCH in $BRANCHES; do

              # Fetch the latest run for the branch
              URL="https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/actions/workflows/$WORKFLOW_FILE/runs?branch=$BRANCH&status=completed&per_page=1"
              echo "$URL"
              RUNS=$(curl -s -H "Authorization: Bearer $RS_SERVER_PAT" "$URL")

              # Extract the run ID
              RUN_ID=$(echo "$RUNS" | jq -r '.workflow_runs[0].id')
              if [[ -z "$RUN_ID" || "$RUN_ID" == null ]]; then
                  echo "No workflow run found for branch $BRANCH in $REPO_OWNER/$REPO_NAME"
              else
                  echo "Latest run ID from $BRANCH: $RUN_ID"
                  echo "run-id=$RUN_ID" >> $GITHUB_OUTPUT
                  exit 0
              fi
          done

          # No branch found
          exit 1

      - name: Download rs-client-libraries-wheels
        uses: actions/download-artifact@v4
        with:
          path: ./docker/jupyter
          pattern: rs_client_libraries-*-py3-none-any.whl
          merge-multiple: true
          github-token: ${{ secrets.RS_SERVER_PAT }}
          repository: RS-PYTHON/rs-client-libraries
          run-id: ${{ steps.rs-client-run-id.outputs.run-id }}

      - name: Resolve rs-demo branch
        id: rs-demo-branch
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_BRANCH: ${{ needs.set-binary-env.outputs.branch_name }}
        run: |
          if gh api "repos/${{ github.repository_owner }}/rs-demo/branches/${CURRENT_BRANCH}" --silent 2>/dev/null; then
            echo "branch=${CURRENT_BRANCH}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=develop" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - id: publish-docker
        uses: RS-PYTHON/actions/.github/actions/publish-docker@develop
        with:
          dockerfile: ./docker/jupyter/Dockerfile
          build_context_path: ./docker/jupyter
          image_suffix: -jupyter
          image_tags: ${{ needs.set-binary-env.outputs.docker_tags }}
          build_args: |
            BASE_TAG=${{ needs.build-base-jupyter-image.outputs.base-tag }}
            CACHEBUST=${{ github.run_id }}
            RS_DEMO_BRANCH=${{ steps.rs-demo-branch.outputs.branch }}
          dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trivy_skip_dirs: ${{ env.TRIVY_SKIP_DIRS }}
          trivy_skip_files: ${{ env.TRIVY_SKIP_FILES }}
