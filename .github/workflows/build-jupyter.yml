# === Worklow behavior ===
#
# On automatic triggers (push or pull):
# - Check for changes in the files related the base images
# - Build the base images for Dask if there are changes in the base files
# - Set environment for images build
# - Build the Jupyter image
#
# On manual trigger: same workflow but the user can choose to build the base image or not.
# However, if changes are detected in the base images files, it will be built whatever the user choice

name: Build the Jupyter Docker image

# Run workflow only for ...
on:
  pull_request: # pull requests
    types: [opened, synchronize, reopened]
    paths:
      - 'docker/base/**'
      - 'docker/jupyter/**'
      - 'docker/scripts/**'
      - '.github/workflows/build-jupyter.yml'
  push:
    branches: [develop, main] # pushes on the 'develop' or 'main' branches
    tags: ['**'] # new git tags (including hierarchical tags like v1.0/beta)
    paths:
      - 'docker/base/**'
      - 'docker/jupyter/**'
      - 'docker/scripts/**'
      - '.github/workflows/build-jupyter.yml'
  workflow_dispatch: # manual trigger
    inputs:
      docker_tag:
        description: Tag the docker images as e.g. 'latest'
        required: false
      build_base_image:
        description: Build the base image before building the Jupyter image?
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  DOCKER_REGISTRY: ghcr.io
  TRIVY_SKIP_DIRS: /opt/conda/pkgs/cache
  TRIVY_SKIP_FILES: /opt/conda/lib/python3.*/site-packages/bokeh/server/static/js/compiler.js,/opt/conda/lib/python3.*/site-packages/prefect/server/ui/assets/index-CCNfsmcm.js.map

jobs:

  set-binary-env:
    name: Set Docker environment
    if: github.actor != 'dependabot[bot]' # ignore pull requests by github bot
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.set-binary-env.outputs.branch_name }}
      # Use directly the final tags
      docker_tags: ${{ steps.set-binary-env.outputs.docker_tags }},${{ steps.set-binary-env.outputs.docker_final_tags }}
      first_tag: ${{ steps.first-tag.outputs.value }}
    steps:
      - id: set-binary-env
        name: Call action 'set-binary-env'
        uses: RS-PYTHON/actions/.github/actions/set-binary-env@develop
        with:
          manual_tag: ${{ github.event.inputs.docker_tag }}
      - name: First docker tag
        id: first-tag
        run: |
          set -x
          # Keep the first image tag from a list as tag1,tag2,tag3
          value=$(echo ${{ steps.set-binary-env.outputs.docker_tags }} | cut -d , -f1)
          echo "value=$value" >> $GITHUB_OUTPUT

  # Enable conditional execution of workflow steps and jobs, based on the files modified
  # by pull request, on a feature branch, or by the recently pushed commits.
  changes:
    runs-on: ubuntu-latest
    name: Check modified files for base images
    permissions:
      pull-requests: read
    outputs:
      base: ${{ steps.filter.outputs.base }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            base:
              - docker/base/Dockerfile.jupyter
              - docker/scripts/create-jupyter-kernels.sh
              - docker/scripts/dask-cluster-versions.yml
          list-files: 'json' # Enables listing of files matching the filter

  build-base-jupyter-image:
    runs-on: ubuntu-latest
    name: Build base image for Jupyter
    needs: [set-binary-env, changes]
    if: ${{
      ((github.event_name != 'workflow_dispatch') && (needs.changes.outputs.base == 'true')) ||
      ((github.event_name == 'workflow_dispatch') && (github.event.inputs.build_base_image == 'true'))
      }}
    permissions:
      contents: read
      security-events: write # needed for github/codeql-action/upload-sarif
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - id: publish-docker
        uses: RS-PYTHON/actions/.github/actions/publish-docker@feat-rspy1108/jupyter-cicd
        with:
          dockerfile: ./docker/base/Dockerfile.jupyter
          build_context_path: ./docker/scripts
          image_basename: ${{ github.repository_owner }}/
          image_suffix: quay.io/jupyter/base-notebook
          image_tags: ${{ needs.set-binary-env.outputs.docker_tags }}
          dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trivy_skip_dirs: ${{ env.TRIVY_SKIP_DIRS }}
          trivy_skip_files: ${{ env.TRIVY_SKIP_FILES }}

  # NOTE: after rebuilding the base image, it would be nice if we would run the rs-client-libraries ci/cd
  # so the jupyter image for local mode is rebuilt. But it's too dangerous if the rs-client-libraries ci/cd
  # is already running: the two runs would overwrite each other's docker images and the result would be unstable.

  build-rs-client-wheel:
    name: Build rs-client-libraries wheel
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' # ignore pull requests by github bot
    needs: [set-binary-env]
    steps:
      - name: Resolve rs-client-libraries branch
        id: rs-client-libraries
        uses: RS-PYTHON/actions/.github/actions/get-repo-branch@feat-rspy1108/jupyter-cicd
        with:
          repo: RS-PYTHON/rs-client-libraries
          branches: ${{ needs.set-binary-env.outputs.branch_name }},develop
      - uses: actions/checkout@v6
        with:
          repository: RS-PYTHON/rs-client-libraries

          ref: ${{ steps.rs-client-libraries.outputs.branch }}
          fetch-depth: 0 # so that Dunamai produce the correct version
      - id: build-wheel
        uses: RS-PYTHON/actions/.github/actions/build-wheel@develop

  publish-docker:
    if: ${{ always() && !failure() && !cancelled() && (github.actor != 'dependabot[bot]') }} # Run the job even if previous job was skipped
    runs-on: ubuntu-latest
    name: Build image for Jupyter
    needs: [set-binary-env, build-base-jupyter-image, build-rs-client-wheel]
    permissions:
      security-events: write # needed for github/codeql-action/upload-sarif
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Copy common requirements
        id: copy_common_req
        shell: bash
        run: |
          mkdir -p ./docker/jupyter/resources/
          cp ./docker/scripts/*.* ./docker/jupyter/resources/

      - name: Download .whl dependency
        uses: actions/download-artifact@v8
        with:
          pattern: rs_client_libraries-*.whl
          path: ./docker/jupyter

      - name: Resolve rs-demo branch
        id: rs-demo-branch
        uses: RS-PYTHON/actions/.github/actions/get-repo-branch@feat-rspy1108/jupyter-cicd
        with:
          repo: RS-PYTHON/rs-demo
          branches: ${{ needs.set-binary-env.outputs.branch_name }},develop

      - id: publish-docker
        uses: RS-PYTHON/actions/.github/actions/publish-docker@feat-rspy1108/jupyter-cicd
        with:
          dockerfile: ./docker/jupyter/Dockerfile
          build_context_path: ./docker/jupyter
          image_suffix: -jupyter
          image_tags: ${{ needs.set-binary-env.outputs.docker_tags }}
          build_args: |
            BASE_TAG=${{ needs.set-binary-env.outputs.first_tag }}
            CACHEBUST=${{ github.run_id }}
            RS_DEMO_BRANCH=${{ steps.rs-demo-branch.outputs.branch }}
          dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trivy_skip_dirs: ${{ env.TRIVY_SKIP_DIRS }}
          trivy_skip_files: ${{ env.TRIVY_SKIP_FILES }}
