name: Build the base Docker images for Prefect

# Run workflow only for ...
on:
  pull_request: # pull requests
    types: [opened, synchronize, reopened]
    paths:
      - 'docker/base/**'
      - 'docker/scripts/**'
      - '.github/actions/publish-docker/action.yml'
      - '.github/workflows/build-base-images.yml'
  push:
    branches:
      - develop # pushes on the 'develop' branch
    tags:
      - '**' # new git tags (including hierarchical tags like v1.0/beta)
    paths:
      - 'docker/base/**'
      - 'docker/scripts/**'
      - '.github/actions/publish-docker/action.yml'
      - '.github/workflows/build-base-images.yml'
  workflow_dispatch: # manual trigger

jobs:
  build-base-prefect-images:
    runs-on: ubuntu-latest
    name: Build base images for Prefect
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and push base images
        run: docker/base/build-base-images.sh -t prefect --push
