gateway:
  auth:
    type: jupyterhub
    jupyterhub:
      apiToken: {{ jupyterhub.ops.services.daskgateway.apitoken }}
      apiUrl: {{ jupyterhub.ops.services.daskgateway.apiurl }}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: "node-role.kubernetes.io/rs_env"
              operator: Exists
  resources:
    limits:
      memory: 84Mi
    requests:
      memory: 62Mi
  tolerations:
    - key: role
      value: rs_env
      effect: NoSchedule
  extraConfig:
    clusteroptions: |
        from dask_gateway_server.options import Options, Integer, Float, String, Mapping, Select

        PROFILES = {
            "default": {
                "role": "access_csc",
                "req_cores": 1.0,
                "lim_cores": 2.0,
                "dask_mem": "4G",
                "req_mem": "3Gi",
                "lim_mem": "4Gi",
                "max_cluster_cores": 20,
                "max_cluster_mem": 64 * 1024**3,
            },
            "large": {
                "role": "dask_worker_on_demand",
                "req_cores": 6.5,
                "lim_cores": 8.0,
                "dask_mem": "48G",
                "req_mem": "45Gi",
                "lim_mem": "52Gi",
                "max_cluster_cores": 80,
                "max_cluster_mem": 384 * 1024**3,
            },
            "xlarge": {
                "role": "big_dask_worker_on_demand",
                "req_cores": 13.5,
                "lim_cores": 16.0,
                "dask_mem": "100G",
                "req_mem": "96Gi",
                "lim_mem": "110Gi",
                "max_cluster_cores": 64,
                "max_cluster_mem": 512 * 1024**3,
            },
        }

        def option_handler(options):
            profile_key = getattr(options, "worker_profile", "default")

            # Dynamic auto-promotion if custom heavy parameters are passed on default profile
            if profile_key == "default":
                if options.worker_memory > 48 or options.worker_cores > 6.5:
                    profile_key = "xlarge"
                elif options.worker_memory > 4 or options.worker_cores > 1.5:
                    profile_key = "large"

            prof = PROFILES[profile_key]
            role_name = prof["role"]

            # Base pod config from profile with backward compatibility for custom user configs
            pod_config = dict(options.worker_extra_pod_config) if getattr(options, "worker_extra_pod_config", None) else {}

            if "affinity" not in pod_config:
                pod_config["affinity"] = {
                    "nodeAffinity": {
                        "requiredDuringSchedulingIgnoredDuringExecution": {
                            "nodeSelectorTerms": [
                                {
                                    "matchExpressions": [
                                        {
                                            "key": f"node-role.kubernetes.io/{role_name}",
                                            "operator": "Exists",
                                        }
                                    ]
                                }
                            ]
                        }
                    }
                }

            pod_config.setdefault("tolerations", [])
            has_role_toleration = any(
                tol.get("key") == "role" for tol in pod_config["tolerations"]
            )
            if not has_role_toleration:
                pod_config["tolerations"].append({
                    "key": "role",
                    "operator": "Equal",
                    "value": role_name,
                    "effect": "NoSchedule",
                })

            pod_config.setdefault("volumes", [])
            if not any(v.get("name") == "cpm-test-data" for v in pod_config["volumes"]):
                pod_config["volumes"].append({
                    "name": "cpm-test-data",
                    "persistentVolumeClaim": {
                        "claimName": "shared-cpm-tests",
                    },
                })

            # Base container config
            container_config = dict(options.worker_extra_container_config) if getattr(options, "worker_extra_container_config", None) else {}
            container_config.setdefault("imagePullPolicy", "IfNotPresent")

            container_config.setdefault("envFrom", [])
            if not any(e.get("secretRef", {}).get("name") == "obs" for e in container_config["envFrom"]):
                container_config["envFrom"].append({"secretRef": {"name": "obs"}})

            container_config.setdefault("volumeMounts", [])
            if not any(m.get("name") == "cpm-test-data" for m in container_config["volumeMounts"]):
                container_config["volumeMounts"].append({
                    "name": "cpm-test-data",
                    "mountPath": "/mnt/test-data",
                    "readOnly": False,
                })

            container_config.setdefault("resources", {
                "requests": {
                    "cpu": f"{prof['req_cores']:.3f}",
                    "memory": prof["req_mem"],
                },
                "limits": {
                    "cpu": f"{prof['lim_cores']:.3f}",
                    "memory": prof["lim_mem"],
                },
            })

            return {
                "worker_cores": prof["req_cores"],
                "worker_cores_limit": prof["lim_cores"],
                "worker_memory": prof["dask_mem"],
                "worker_memory_limit": prof["lim_mem"],
                "scheduler_core_limit": options.scheduler_core_limit,
                "scheduler_memory_limit": "%fG" % options.scheduler_memory_limit,
                "image": options.image,
                "namespace": options.namespace,
                "cluster_max_cores": max(options.cluster_max_cores, prof["max_cluster_cores"]),
                "cluster_max_memory": max(options.cluster_max_memory, prof["max_cluster_mem"]),
                "cluster_max_workers": options.cluster_max_workers,
                "cluster_name": options.cluster_name,
                "scheduler_extra_container_config": options.scheduler_extra_container_config,
                "scheduler_extra_pod_annotations": options.scheduler_extra_pod_annotations,
                "scheduler_extra_pod_config": options.scheduler_extra_pod_config,
                "scheduler_extra_pod_labels": options.scheduler_extra_pod_labels,
                "environment": options.environment,
                "worker_extra_pod_config": pod_config,
                "worker_extra_container_config": container_config,
            }

        c.Backend.cluster_options = Options(
            Select("worker_profile", ["default", "large", "xlarge"], default="default", label="Worker Profile"),
            Float("worker_cores", 1, min=1, max=16, label="Worker Cores"),
            Float("worker_memory", 4, min=1, max=128, label="Worker Memory (GiB)"),
            Float("scheduler_core_limit", 1, min=1, max=2, label="Scheduler Max Cores"),
            Float("scheduler_memory_limit", 2, min=1, max=64, label="Scheduler Max Memory (GiB)"),
            String("image", default="ghcr.io/rs-python/rs-infra-core-dask-gateway:latest", label="Image"),
            String("namespace", default="dask-gateway", label="Namespace"),
            Float("cluster_max_cores", 4, min=1, max=80, label="Cluster max cores"),
            Float("cluster_max_memory", default=17179869184, min=1073741824, max=549755813888, label="Cluster max memory"),
            Integer("cluster_max_workers", 5, min=1, max=20, label="Cluster max workers"),
            String("cluster_name", default="MyDaskCluster", label="Cluster Name"),
            Mapping("scheduler_extra_container_config", default={"readinessProbe":{"failureThreshold":3,"httpGet":{"path":"/api/health","port":8788,"scheme":"HTTP"},"periodSeconds":5,"successThreshold":1,"timeoutSeconds":15}, "imagePullPolicy": "Always", "volumeMounts":[{"name":"cpm-test-data","mountPath":"/mnt/test-data","readOnly":False}]}, label="scheduler_extra_container_config"),
            Mapping("scheduler_extra_pod_annotations", default={"usage":"unknown","access":"internal"}, label="Scheduler_extra_pod_annotations"),
            Mapping("scheduler_extra_pod_config", default={"affinity":{"nodeAffinity":{"requiredDuringSchedulingIgnoredDuringExecution":{"nodeSelectorTerms":[{"matchExpressions":[{"key":"node-role.kubernetes.io/access_csc","operator":"Exists"}]}]}}},"tolerations":[{"key":"role","operator":"Equal","value":"access_csc","effect":"NoSchedule"}],"volumes":[{"name":"cpm-test-data","persistentVolumeClaim":{"claimName":"shared-cpm-tests"}}]}, label="Scheduler_extra_pod_config"),
            Mapping("scheduler_extra_pod_labels", default={"user":"unknown","team":"unknown","cluster_name":"MyDaskCluster"}, label="Scheduler_extra_pod_labels"),
            Mapping("environment", default={"S3_ENDPOINT":"{{ s3.endpoint }}","S3_REGION":"{{ s3.region }}","TEMPO_ENDPOINT":"http://alloy.monitoring.svc.cluster.local:4317", "OTEL_PYTHON_REQUESTS_TRACE_HEADERS":"0", "OTEL_PYTHON_REQUESTS_TRACE_BODY":"0"}, label="Environment variables"),
            Mapping("worker_extra_pod_config", default={}, label="Worker_extra_pod_config"),
            Mapping("worker_extra_container_config", default={}, label="Worker_extra_container_config"),
            handler=option_handler,
        )

  backend:
    imagePullSecrets:
      - name: ghcr-k8s
    namespace: dask-gateway
    scheduler:
      extraContainerConfig:
        volumeMounts:
          - name: cpm-test-data
            mountPath: /mnt/test-data
      extraPodConfig:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                  - key: "node-role.kubernetes.io/rs_env"
                    operator: Exists
        tolerations:
          - key: role
            value: rs_env
            effect: NoSchedule
        volumes:
          - name: cpm-test-data
            persistentVolumeClaim:
              claimName: shared-cpm-tests
    worker:
      extraContainerConfig:
        volumeMounts:
          - name: cpm-test-data
            mountPath: /mnt/test-data
      extraPodConfig:
        volumes:
          - name: cpm-test-data
            persistentVolumeClaim:
              claimName: shared-cpm-tests

controller:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: "node-role.kubernetes.io/rs_env"
              operator: Exists
  resources:
    limits:
      memory: 96Mi
    requests:
      memory: 64Mi
  tolerations:
    - key: role
      value: rs_env
      effect: NoSchedule

traefik:
  additionalArguments:
    - --providers.kubernetescrd.allowcrossnamespace=false
  service:
    type: ClusterIP
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: "node-role.kubernetes.io/rs_env"
              operator: Exists
  resources:
    limits:
      memory: 64Mi
    requests:
      memory: 24Mi
  tolerations:
    - key: role
      value: rs_env
      effect: NoSchedule
