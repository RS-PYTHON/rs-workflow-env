# -- fully override common.names.fullname
fullnameOverride: "{{ prefect3server.ops.name }}-server"

global:
  prefect:
    image:
      repository: prefecthq/prefect
      prefectTag: 3.7.5-python3.13-kubernetes
      pullPolicy: IfNotPresent

    loggingLevel: WARNING

server:
  ## If you want to run the UI seperately from the server, you will need to set the UI-specific URLs below
  uiConfig:
    # -- set PREFECT_UI_ENABLED; enable the UI on the server
    enabled: true
    # -- sets PREFECT_UI_API_URL
    #prefectUiApiUrl: "https://{{ prefect3server.ops.subDomain }}.{{ platform_domain_name }}/api"
    # -- sets PREFECT_UI_URL
    #prefectUiUrl: "https://{{ prefect3server.ops.subDomain }}.{{ platform_domain_name }}"
    # -- sets PREFECT_UI_STATIC_DIRECTORY
    #prefectUiStaticDirectory: "/ui_build"
    prefectUiApiUrl: "https://{{ prefect3server.ops.subDomain }}.{{ platform_domain_name }}/api"

  env:
    - name: PREFECT_LOGGING_EXTRA_LOGGERS
      value: dask,scipy
    - name: PREFECT_LOGGING_LOGGERS_PREFECT_EXTRA_LEVEL
      value: INFO
    - name: PREFECT_LOGGING_LOGGERS_PREFECT_EXTRA_HANDLERS
      value: "[api console]"
    - name: PREFECT_LOGGING_LOGGERS_PREFECT_FLOW_RUNS_LEVEL
      value: DEBUG
    - name: PREFECT_LOGGING_LOGGERS_PREFECT_FLOW_RUNS_HANDLERS
      value: "[api console]"
    - name: PREFECT_LOGGING_LOGGERS_PREFECT_TASK_RUNS_HANDLERS
      value: "[api console]"
    - name: PREFECT_LOGGING_LOGGERS_PREFECT_TASK_RUNS_LEVEL
      value: INFO
    - name: PREFECT_LOGGING_ROOT_LEVEL
      value: INFO
    - name: PREFECT_SERVER_ANALYTICS_ENABLED
      value: "false"
    - name: DO_NOT_TRACK
      value: "1"
    - name: FORWARDED_ALLOW_IPS
      value: "*"

  # requests MUST be specified if using an HPA, otherwise the HPA will not know when to trigger a scale event
  resources:
    # -- the requested resources for the server container
    requests:
      cpu: 500m
      memory: 512Mi
    # -- the requested limits for the server container
    limits:
      cpu: "1"
      memory: 2Gi

  # ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true

  # -- affinity for server pods assignment
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: "node-role.kubernetes.io/rs_env"
              operator: Exists
  tolerations:
    - key: role
      value: rs_env
      effect: NoSchedule
## ServiceAccount configuration
serviceAccount:
  # -- specifies whether a ServiceAccount should be created
  create: true

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  #path must be /
  host:
    hostname: "{{ prefect3server.ops.subDomain }}.{{ platform_domain_name }}"
    path: /
    pathType: Prefix

  annotations:
    cert-manager.io/cluster-issuer: "{{ cluster_issuer }}"
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-buffer-size: 32k
    nginx.ingress.kubernetes.io/auth-signin: "https://oauth2-proxy.{{ platform_domain_name }}/oauth2/start?rd=$scheme://$host$request_uri"
    nginx.ingress.kubernetes.io/auth-url: "https://oauth2-proxy.{{ platform_domain_name }}/oauth2/auth?allowed_groups={{ prefect3server.ops.allowedRoles | default('role:RS-ADMIN', true) }}"
    nginx.ingress.kubernetes.io/auth-response-headers: Authorization

  tls: true
  # -- create a TLS secret for this ingress record using self-signed certificates generated by Helm
  selfSigned: false

  extraTls:
    - hosts:
        - "{{ prefect3server.ops.subDomain }}.{{ platform_domain_name }}"
      secretName: "{{ prefect3server.ops.subDomain }}-{{ platform_domain_name | replace(".", "-") }}"

# Disable bundled postgresql
postgresql:
  enabled: false

# Postgresql credentials
secret:
  create: true
  name: "{{ prefect3server.ops.name }}-database-password"
  username: "{{ prefect3server.ops.database.username }}"
  password: "{{ prefect3server.ops.database.password }}"
  host: "{{ prefect3server.ops.database.host }}"
  port: 5432
  database: "{{ prefect3server.ops.database.name }}"
